    <!-- Dev Preview WebSocket Guard: silences only Vite dev HMR closure, never in production -->
    <script>
      if (window.location.hostname.includes('run.app') || window.location.hostname === 'localhost') { window.addEventListener('unhandledrejection', function(e) { if ((e.reason?.message || e.reason) === 'WebSocket closed without opened') e.preventDefault(); }); }
    </script>
