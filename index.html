    <!-- Defensive Fetch Setter Guard for Sandboxed / Preview Environments -->
    <script>
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If already defined or non-configurable, continue safely
        }
      })();
    </script>
